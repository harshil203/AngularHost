name: Build and Push Angular Docker Image

on:
  push:
    branches:
      - development

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        working-directory: doctor-website
        run: docker build -t ghcr.io/${{ github.repository_owner }}/angularhost:latest .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/angularhost:latest